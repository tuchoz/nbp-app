# NBP application: build, scan, generate SBOM and publish.
# Emergency override must be explicitly enabled for an authorized build.

substitutions:
  _LOCATION: europe-central2
  _REPOSITORY: nbp-docker
  _IMAGE: nbp-app
  _ALLOW_TRIVY_FAILURE: "false"

steps:
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - docker/Dockerfile
      - --tag
      - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - .

  - id: trivy-scan
    name: aquasec/trivy:0.68.2
    entrypoint: sh
    waitFor: [docker-build]
    args:
      - -c
      - |
        trivy image \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          --exit-code 0 \
          --format json \
          --output /workspace/trivy-report.json \
          "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA"

        RESULT=$?

        if [ "$$RESULT" -ne 0 ]; then
          echo "SECURITY SCAN ERROR: Trivy could not complete the scan."

          if [ "${_ALLOW_TRIVY_FAILURE}" = "true" ]; then
            echo "WARNING: Emergency override enabled. Image was NOT successfully scanned."
            exit 0
          fi

          echo "BLOCKED: Trivy scan failed. Explicit emergency override is required."
          exit 1
        fi

        echo "Trivy scan completed. Report: trivy-report.json"

  - id: generate-sbom
    name: aquasec/trivy:0.68.2
    entrypoint: sh
    waitFor: [trivy-scan]
    args:
      - -c
      - |
        trivy image \
          --format cyclonedx \
          --output /workspace/sbom.cdx.json \
          "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA"

        RESULT=$?

        if [ "$$RESULT" -ne 0 ]; then
          if [ "${_ALLOW_TRIVY_FAILURE}" = "true" ]; then
            echo "WARNING: SBOM generation failed under emergency override."
            exit 0
          fi

          exit 1
        fi

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    waitFor: [generate-sbom]
    args:
      - push
      - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED

timeout: 1800s