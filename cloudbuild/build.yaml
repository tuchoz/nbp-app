# NBP Application - Build, Scan, SBOM, Publish
# Java 21 + Spring Boot

substitutions:
  _LOCATION: europe-central2
  _REPOSITORY: nbp-docker
  _IMAGE: nbp-app
  _ALLOW_TRIVY_FAILURE: "false"

steps:
  # 1. Maven tests
  - id: java-tests
    name: eclipse-temurin:21-jdk-noble
    entrypoint: bash
    args:
      - -euc
      - |
        chmod +x ./mvnw
        ./mvnw -B clean verify

  # 2. Docker build
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    waitFor: [java-tests]
    args:
      - build
      - --file
      - docker/Dockerfile
      - --tag
      - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - .

  # 3. Security scanning
  - id: trivy-scan
    name: aquasec/trivy:0.68.2
    entrypoint: sh
    waitFor: [docker-build]
    args:
      - -c
      - |
        trivy image \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          --format json \
          --output /workspace/trivy-report.json \
          "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA"

        RESULT=$?

        if [ "$$RESULT" -ne 0 ]; then
          if [ "${_ALLOW_TRIVY_FAILURE}" = "true" ]; then
            echo "WARNING: Authorized security override enabled."
            echo "Image contains vulnerabilities or the scan failed."
            exit 0
          fi

          echo "BLOCKED: Vulnerabilities HIGH/CRITICAL or Trivy scan error."
          exit 1
        fi

        echo "Security scan passed."

  # 4. CycloneDX SBOM
  - id: generate-sbom
    name: aquasec/trivy:0.68.2
    entrypoint: sh
    waitFor: [trivy-scan]
    args:
      - -c
      - |
        trivy image \
          --format cyclonedx \
          --output /workspace/sbom.cdx.json \
          "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA"

        RESULT=$?

        if [ "$$RESULT" -ne 0 ]; then
          if [ "${_ALLOW_TRIVY_FAILURE}" = "true" ]; then
            echo "WARNING: SBOM generation failed under emergency override."
            exit 0
          fi

          echo "BLOCKED: SBOM generation failed."
          exit 1
        fi

        echo "SBOM generated."

  # 5. Publish image
  - id: docker-push
    name: gcr.io/cloud-builders/docker
    waitFor: [generate-sbom]
    args:
      - push
      - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED

timeout: 1800s